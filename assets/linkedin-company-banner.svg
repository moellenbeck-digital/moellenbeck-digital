<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191" role="img" aria-labelledby="title desc">
  <title id="title">Moellenbeck-Digital LinkedIn Company Banner</title>
  <desc id="desc">Wide dark LinkedIn company banner for Moellenbeck-Digital.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.30"/>
      <stop offset="66%" stop-color="#fb923c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#fb923c" opacity="0.08"/>
    </pattern>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#fb923c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#111114" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1128" height="191" fill="#08080a"/>
  <rect width="1128" height="191" fill="url(#dot-grid)"/>
  <circle cx="910" cy="96" r="270" fill="url(#glow)"/>
  <rect x="36" y="24" width="1056" height="143" fill="none" stroke="#222228"/>
  <rect x="36" y="24" width="4" height="143" fill="#fb923c"/>
  <rect x="36" y="24" width="300" height="26" fill="url(#band)"/>

  <g font-family="DM Mono, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2.7" text-transform="uppercase">
    <circle cx="64" cy="38" r="3.5" fill="#fb923c"/>
    <text x="78" y="43" fill="#fb923c">MD_</text>
    <text x="125" y="43" fill="#222228">/</text>
    <text x="145" y="43" fill="#6b6b76">Digital Studio</text>
  </g>

  <g transform="translate(312 60)">
    <text x="0" y="0" fill="#fb923c" font-family="DM Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="2.5">UG (HAFTUNGSBESCHRAENKT)</text>
    <text x="0" y="47" fill="#e8e8ed" font-family="Syne, Inter, system-ui, sans-serif" font-size="49" font-weight="800" letter-spacing="-1.4">moellenbeck</text>
    <text x="309" y="47" fill="#fb923c" font-family="Syne, Inter, system-ui, sans-serif" font-size="49" font-weight="800" letter-spacing="-1.4">digital</text>
    <text x="2" y="82" fill="#e8e8ed" font-family="Inter, system-ui, sans-serif" font-size="18">Software, Automatisierung und KI.</text>
  </g>

  <g font-family="DM Mono, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.1">
    <text x="64" y="145" fill="#222228">//</text>
    <text x="89" y="145" fill="#6b6b76">Digital · Remote</text>
    <text x="886" y="145" fill="#fb923c">moellenbeck-digital.io -&gt;</text>
  </g>
</svg>
