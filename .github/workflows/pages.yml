# Deploy GitHub Pages from an allowlist (scripts/pages-allowlist.txt), not from the whole repo.
#
# Safe before the switch: the job "source" reads the Pages build type. While it is "legacy"
# (Pages builds main with Jekyll), the deploy job is skipped and the live site does not change.
# If the build type cannot be read (API error), the run fails (red), so the problem is visible.
# GET /repos/{owner}/{repo}/pages needs "Pages: read" (GitHub docs, permissions for fine-grained tokens).
# Switch (dev-cos, at merge):
#   gh api -X PUT repos/moellenbeck-digital/moellenbeck-digital/pages -f build_type=workflow
#   gh workflow run pages.yml --ref main
# Rollback:
#   gh api -X PUT repos/moellenbeck-digital/moellenbeck-digital/pages -f build_type=legacy \
#     -f 'source[branch]=main' -f 'source[path]=/'
#   gh api -X POST repos/moellenbeck-digital/moellenbeck-digital/pages/builds   # rebuild main now
#   gh api repos/moellenbeck-digital/moellenbeck-digital/pages/builds/latest --jq '.status,.commit'
#   # wait until status = built and commit = HEAD of main, then check live:
#   curl -sI https://moellenbeck-digital.io/ | head -1        # expect HTTP 200
#   curl -s  https://moellenbeck-digital.io/ | cmp - index.html && echo live = repo
name: Pages (allowlist deploy)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify public text mirror
        run: python3 scripts/generate-llms.py --check
      - name: Verify llms.txt
        run: python3 scripts/check-llms-txt.py
      - name: Verify head metadata and JSON-LD of all sitemap pages
        run: python3 scripts/check-meta.py
      - name: Build _site from the allowlist (fails on unknown files)
        run: python3 scripts/build-pages.py --out _site
      - name: Verify _site = allowlist, byte-identical
        run: python3 scripts/build-pages.py --verify _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  source:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.get.outputs.build_type }}
    steps:
      - id: get
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # API error: fail (red). Skip the deploy only if the build type was read and is not "workflow".
          if ! t=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type) || [ -z "$t" ]; then
            echo "::error::Pages build type not readable (GET repos/${GITHUB_REPOSITORY}/pages). Deploy not done; check the Pages settings and the token permission pages: read."
            exit 1
          fi
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          if [ "$t" != workflow ]; then
            echo "::notice::Pages build type is '$t', not 'workflow': deploy skipped, live site unchanged."
          fi
  deploy:
    needs: [build, source]
    if: github.ref == 'refs/heads/main' && needs.source.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
