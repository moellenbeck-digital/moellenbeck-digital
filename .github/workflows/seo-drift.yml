name: SEO mirror drift
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify public text mirror
        run: python3 scripts/generate-llms.py --check
      - name: Verify the Hausverwaltung copies of the avatar and motion assets are byte-identical
        run: |
          for f in agents.css agents.js motion.css motion.js img/avatar-200.webp; do
            cmp "assets/$f" "hausverwaltung/assets/$f"
          done
      - name: Build Pages site from the allowlist (every tracked file public or internal, none unknown)
        run: python3 scripts/build-pages.py --out _site_allow
      - name: Verify allowlist build = public files, byte-identical
        run: python3 scripts/build-pages.py --verify _site_allow
      - name: Build like GitHub Pages (Jekyll, github-pages gem)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Verify Pages publishes no internal files and copies the rest unchanged
        run: python3 scripts/check-pages-exclude.py --built _site
      # Until the switch to build_type=workflow the live site comes from this Jekyll build.
      # It must publish exactly the allowlist, so the switch changes no public file.
      - name: Verify legacy Jekyll build = allowlist (switch is a no-op for visitors)
        run: python3 scripts/build-pages.py --verify _site
      - name: Verify llms.txt (blockquote = footer, files, anchors, entity sentences = schema = hero)
        run: python3 scripts/check-llms-txt.py
      - name: Verify head metadata and JSON-LD of all sitemap pages
        run: python3 scripts/check-meta.py
      - name: Verify custom 404 page (noindex, root-relative links to published files)
        run: python3 scripts/check-404.py
      - name: Verify GEO measurement table (format only, sends nothing)
        run: python3 scripts/geo-visibility.py --check
      # dateModified comes from the commit date of each page. A squash merge on a later day
      # gives main a new commit date, so this check is not squash-stable on main.
      # It runs on pull requests only. After a squash merge on another day:
      # run scripts/update-dates.py and scripts/generate-llms.py on main and commit.
      - name: Verify dateModified = last commit date (pull requests only)
        if: github.event_name == 'pull_request'
        run: python3 scripts/update-dates.py --check
